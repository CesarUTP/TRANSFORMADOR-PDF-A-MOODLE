# Pruebas automáticas en cada push y pull request, en los tres sistemas.
# No necesitan internet más allá de instalar dependencias, ni claves ni
# Gemini: la IA se simula (ver dev/test_mejoras.py).
name: Pruebas

on:
  push:
    branches: [main, colaboracion]
  pull_request:

# Solo lectura: esta tarea no publica ni modifica nada del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"   # Windows: la salida lleva tildes y símbolos (→, ⟦ ⟧)
    steps:
      # Acciones fijadas a un commit exacto (no a una etiqueta, que se puede mover).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r dev/requirements-dev.txt "pywebview==6.2.1"
      - name: Casos borde (marcas, clave, XML)
        if: ${{ !cancelled() }}
        run: python dev/test_casos_borde.py
      - name: Seguridad (servidor local, launcher, límites)
        if: ${{ !cancelled() }}
        run: python dev/test_seguridad.py
      - name: Word, imágenes, retroalimentación y fórmulas
        if: ${{ !cancelled() }}
        run: python dev/test_mejoras.py
      - name: XML idéntico a la línea base (red de seguridad de refactores)
        if: ${{ !cancelled() }}
        run: python dev/test_xml_baseline.py
      - name: Modelo de pregunta tipado (ida y vuelta exacta)
        if: ${{ !cancelled() }}
        run: python dev/test_modelo.py
      - name: Origen, confianza y ubicación en el PDF
        if: ${{ !cancelled() }}
        run: python dev/test_confianza.py
      - name: Frontend (lógica y sintaxis, en Node)
        if: ${{ !cancelled() }}
        run: node dev/test_frontend.mjs
      - name: Extracción y marcas (1.8)
        if: ${{ !cancelled() }}
        run: python dev/test_extraccion.py
      - name: Word avanzado (numeración por estilo y celdas combinadas)
        if: ${{ !cancelled() }}
        run: python dev/test_word_avanzado.py
      - name: Opciones con | y / (índices en paralelo al texto)
        if: ${{ !cancelled() }}
        run: python dev/test_opciones_separadores.py
      - name: XML y validador (1.8)
        if: ${{ !cancelled() }}
        run: python dev/test_xml_validador.py
      - name: IA, cancelación y servidor (1.8)
        if: ${{ !cancelled() }}
        run: python dev/test_ia_servidor.py
      - name: Capa de proveedor de IA (prompts intactos, proveedor falso)
        if: ${{ !cancelled() }}
        run: python dev/test_ia_proveedor.py
      - name: Base de datos y arranque (1.8)
        if: ${{ !cancelled() }}
        run: python dev/test_datos_arranque.py
      # Solo una vez (no en los 3 sistemas: compara archivos, no depende
      # del SO). Antes nadie se enteraba de que ejecutable/ o
      # ejecutable_mac/ quedaron desfasados de backend/frontend hasta
      # compilar el instalador y encontrarlo roto.
      - name: Instaladores sincronizados con el código actual
        if: matrix.os == 'ubuntu-latest'
        run: python dev/sync_ejecutable.py --check
