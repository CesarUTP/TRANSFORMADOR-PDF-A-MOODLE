<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pruebas — lógica del editor</title>
  <!--
    Pruebas de la lógica pura del frontend (puntos y validación de
    preguntas). Se abren en el navegador: http://localhost:PUERTO/pruebas.html
    No necesita Node, ni instalar nada, ni un paso de compilación.
    No se empaqueta en la app: solo sirve durante el desarrollo.
  -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; color: #0f172a; }
    h1 { font-size: 20px; }
    #resumen { font-size: 16px; font-weight: 700; padding: 12px 16px; border-radius: 8px; margin: 16px 0; }
    .ok { background: #dcfce7; color: #166534; }
    .fail { background: #fee2e2; color: #991b1b; }
    li { margin: 4px 0; font-size: 14px; }
    li.mal { color: #991b1b; font-weight: 600; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Pruebas de la lógica del editor</h1>
  <div id="resumen">Corriendo…</div>
  <ul id="lista"></ul>

  <script type="module" src="js/pruebas.js"></script>
</body>
</html>
